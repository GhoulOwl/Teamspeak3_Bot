[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# ── Xvfb (Virtual Display) ──────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb_err.log

# ── PulseAudio Setup (start PA + configure null sink) ─
[program:pulseaudio]
command=bash -c 'pulseaudio --start --exit-idle-time=-1 && sleep 2 && pactl load-module module-null-sink sink_name=ts3bot_sink sink_properties=device.description="TS3Bot_Virtual_Sink" && pactl set-default-sink ts3bot_sink && pactl set-default-source ts3bot_sink.monitor && echo "PulseAudio configured" && sleep infinity'
autorestart=true
priority=20
startsecs=3
startretries=10
environment=DISPLAY=":99"
stdout_logfile=/data/logs/pulseaudio.log
stderr_logfile=/data/logs/pulseaudio_err.log

# ── TeamSpeak 3 Client (Headless) ───────────────
[program:ts3client]
command=bash -c 'sleep 15 && cd /opt/ts3client && TS3SCRIPT=$(find . -name "ts3client_runscript.sh" | head -1) && echo "Found: $TS3SCRIPT" && chmod +x "$TS3SCRIPT" && ./"$TS3SCRIPT"'
autorestart=true
priority=30
startsecs=20
startretries=5
environment=DISPLAY=":99"
stdout_logfile=/data/logs/ts3client.log
stderr_logfile=/data/logs/ts3client_err.log

# ── Python Bot ──────────────────────────────────
[program:bot]
command=bash -c 'sleep 20 && python3 -m bot'
directory=/opt/bot
autorestart=true
priority=40
startsecs=5
environment=DISPLAY=":99"
stdout_logfile=/data/logs/bot.log
stderr_logfile=/data/logs/bot_err.log
