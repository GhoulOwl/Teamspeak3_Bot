[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# ── Xvfb (Virtual Display) ──────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb_err.log

# ── PulseAudio ──────────────────────────────────
[program:pulseaudio]
command=pulseaudio --no-cleanup-expected --exit-idle-time=-1 --daemonize=no
autorestart=true
priority=20
environment=DISPLAY=":99"
stdout_logfile=/data/logs/pulseaudio.log
stderr_logfile=/data/logs/pulseaudio_err.log

# ── PulseAudio Setup (wait + configure null sink) ─
[program:pulse-setup]
command=bash -c 'sleep 3 && pactl load-module module-null-sink sink_name=ts3bot_sink sink_properties=device.description="TS3Bot_Virtual_Sink" && pactl set-default-sink ts3bot_sink && pactl set-default-source ts3bot_sink.monitor && echo "PulseAudio null sink configured" && sleep infinity'
autorestart=true
priority=25
environment=DISPLAY=":99"
stdout_logfile=/data/logs/pulse-setup.log
stderr_logfile=/data/logs/pulse-setup_err.log

# ── TeamSpeak 3 Client (Headless) ───────────────
[program:ts3client]
command=bash -c 'sleep 8 && /opt/ts3client/ts3client_runscript.sh'
autorestart=true
priority=30
startsecs=15
environment=DISPLAY=":99",PULSE_SERVER="unix:/run/user/%(ENV_PULSE_UID)s/pulse/native"
stdout_logfile=/data/logs/ts3client.log
stderr_logfile=/data/logs/ts3client_err.log

# ── Python Bot ──────────────────────────────────
[program:bot]
command=bash -c 'sleep 12 && python3 -m bot'
directory=/opt/bot
autorestart=true
priority=40
startsecs=5
environment=DISPLAY=":99"
stdout_logfile=/data/logs/bot.log
stderr_logfile=/data/logs/bot_err.log
