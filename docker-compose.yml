services:
  ts3bot:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: ts3bot
    restart: unless-stopped
    platform: linux/amd64
    env_file: .env
    volumes:
      - ./config:/opt/bot/config:ro
      - ts3bot-data:/data
      - ts3bot-identity:/home/ts3bot/.ts3client
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    environment:
      - TS3_HOST=${TS3_HOST}
      - TS3_PASSWORD=${TS3_PASSWORD}
      - TS3_VOICE_PORT=${TS3_VOICE_PORT:-9987}
      - TS3_NICKNAME=${TS3_NICKNAME:-MusicBot}
      - NETEASE_API_URL=${NETEASE_API_URL:-http://host.docker.internal:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    shm_size: "256m"
    tmpfs:
      - /tmp:size=100m
      - /run/shm:size=50m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN

volumes:
  ts3bot-data:
  ts3bot-identity:
